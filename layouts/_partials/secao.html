{{- with .itens }}
<section class="secao">
  <h2>{{ $.titulo }}</h2>
  <ul class="lista">
    {{- range . }}
    {{- $miniatura := partial "miniatura.html" .url }}
    <li>
      <a class="ligacao{{ with $miniatura }} ligacao--miniatura{{ end }}" href="{{ .url }}">
        {{- with $miniatura }}<img class="ligacao__miniatura" src="{{ .RelPermalink }}" alt="" width="72" height="72" loading="lazy">{{ end }}
        <span class="ligacao__texto">
          <span class="ligacao__titulo">{{ .titulo }}</span>
          {{- with .data }}<span class="ligacao__data">{{ . }}</span>{{ end }}
        </span>
      </a>
    </li>
    {{- end }}
  </ul>
</section>
{{- end }}
